<div class="login">
  <div class="logo"></div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input
        matInput
        type="email"
        formControlName="email"
        autocomplete="email"
      />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Senha</mat-label>
      <input
        matInput
        type="password"
        formControlName="senha"
        [autocomplete]="modoCadastro ? 'new-password' : 'current-password'"
      />
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="form.invalid || loading"
    >
      {{ modoCadastro ? 'Criar conta' : 'Entrar' }}
    </button>

    <button
      mat-raised-button
      color="warn"
      type="button"
      (click)="logarGoogle()"
      *ngIf="!modoCadastro"
    >
      Login com Google
    </button>

    <a
      mat-button
      color="primary"
      (click)="alternarModo()"
    >
      {{ modoCadastro ? 'Já tenho conta' : 'Não possui cadastro?' }}
    </a>

    <p *ngIf="error" class="error">
      {{ error }}
    </p>

  </form>
</div>
